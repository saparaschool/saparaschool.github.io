<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เข้าสู่ระบบแอดมิน | สภานักเรียนโรงเรียนร้องกวางอนุสรณ์</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar"></div>
  <header class="header" id="site-header" data-group="main" data-active="intex5"></header>

  <main class="page">
    <div class="card login-wrap">
      <img src="/img/lock.svg" class="login-icon" alt="">
      <h2 class="center" style="color:var(--purple-900);margin:0 0 6px;">เข้าสู่โหมดแอดมิน</h2>
      <p class="page-sub center">สำหรับสภานักเรียนเท่านั้น</p>

      <form id="loginForm">
        <button type="submit" class="btn block">เข้าสู่ระบบ</button>
        <p class="error-text" id="err" style="display:none;"></p>
      </form>
    </div>
  </main>

  <script src="/js/nav.js"></script>
  <script src="/js/api.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('err');
      errEl.style.display = 'none';
      const { ok, body } = await postJson('/api/admin/login', {});
      if (ok) window.location.href = '/admin.html';
      else { errEl.textContent = body.error || 'เข้าสู่ระบบไม่สำเร็จ'; errEl.style.display = 'block'; }
    });
  </script>
</body>
</html>
