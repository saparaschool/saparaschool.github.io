<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ผลโหวตกิจกรรมยอดนิยม | สภานักเรียนโรงเรียนร้องกวางอนุสรณ์</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar"></div>
  <header class="header" id="site-header" data-group="admin" data-active="intex6.4"></header>

  <main class="page wide">
    <h1 class="page-title">ผลโหวตกิจกรรมยอดนิยม</h1>
    <p class="page-sub">สรุปจำนวนการเลือกของแต่ละกิจกรรมจากหน้า "โหวตกิจกรรมที่ชอบ"</p>

    <div class="table-toolbar"><h3>สรุปตามกิจกรรม</h3></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>กิจกรรม</th><th>จำนวนการเลือก</th></tr></thead>
        <tbody id="tbody"><tr><td colspan="2" class="center">กำลังโหลด...</td></tr></tbody>
      </table>
    </div>

    <div class="chart-box">
      <h3>ความสัมพันธ์ระหว่างกิจกรรมกับจำนวนคน</h3>
      <canvas id="voteChart"></canvas>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/api.js"></script>
  <script>
    requireAdmin();
    async function load() {
      const { body } = await getJson('/api/votes');
      const rows = body.rows || [];
      const counts = {};
      rows.forEach(r => counts[r.activity] = (counts[r.activity] || 0) + 1);

      const tbody = document.getElementById('tbody');
      const entries = Object.entries(counts).sort((a,b) => b[1]-a[1]);
      tbody.innerHTML = entries.length ? entries.map(([activity, c]) => `<tr><td>${activity}</td><td>${c}</td></tr>`).join('')
        : '<tr><td colspan="2" class="center">ยังไม่มีข้อมูล</td></tr>';

      new Chart(document.getElementById('voteChart'), {
        type: 'bar',
        data: {
          labels: entries.map(e => e[0]),
          datasets: [{ label: 'จำนวนการเลือก', data: entries.map(e => e[1]), backgroundColor: '#C9A24B' }],
        },
        options: { responsive: true, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } } },
      });
    }
    load();
  </script>
</body>
</html>
